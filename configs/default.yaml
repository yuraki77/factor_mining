data:
  symbols: ["BTCUSDT", "ETHUSDT"]
  markets: ["spot", "um_futures"]
  default_interval: "5m"
  on_demand_intervals: ["1m"]
  start_date: "2020-01-01"
  raw_dir: "data/raw"
  parquet_dir: "data/parquet"
  sqlite_path: "data/factor_mining.sqlite3"

trial_ledger:
  partition: "family_and_rolling_window"
  window_days: 90

walk_forward:
  mode: "rolling"
  train_months: 12
  validation_months: 3
  test_months: 3
  purge_bars_floor: 288
  embargo_bars: 288
  min_folds: 4

cpcv:
  n_groups: 8
  test_groups: 2
  pbo_threshold: 0.40
  ml_pbo_threshold: 0.30

regime:
  method: "btc_rolling_60d"
  bull_threshold: 0.20
  bear_threshold: -0.20
  high_vol_rank: 0.85

bootstrap:
  method: "stationary_block"
  n_resamples: 1000
  min_block_length_bars: 288
  block_length_multiplier: 2.0
  ci_levels: [0.05, 0.95]

newey_west:
  kernel: "bartlett"
  bandwidth: "fixed_cube_root"

permutation_test:
  n_permutations: 100
  permute_target: "factor_values"
  test_statistic: "mean_ic"

position_sizing:
  primary: "vol_target"
  secondary: "fixed_notional"
  target_annual_vol: 0.15
  vol_window_days: 30
  max_leverage: 3.0
  symbol_max_leverage:
    BTCUSDT: 3.0
    ETHUSDT: 3.0
  fixed_notional_usd: 10000.0

exit:
  stop_loss_pct: -0.05
  max_hold_bars: 0
  tp_tiers: []
  trailing_stop_pct: 0.0
  trailing_after_first_tp: true

costs:
  maker_bps: 2.0
  taker_bps: 5.0
  slippage_base_bps: 1.0
  slippage_k: 25.0
  slippage_gamma: 0.5
  # Per-market taker fees (Binance regular tier, 2026-07): spot ~10bps vs USDT-M
  # futures ~5bps. Replace with your actual VIP/BNB-discount tier — one edit here
  # and every backtest re-prices. apply_trade_overrides still layers global
  # scenario knobs on top of these.
  per_market:
    spot:
      taker_bps: 10.0
    um_futures:
      taker_bps: 5.0

capacity:
  adv_participation: 0.05
  min_capacity_usd: 10000.0

ml_complexity:
  max_depth: 3
  max_features: 32
  min_train_samples: 5000

llm:
  deepseek:
    base_url: "https://api.deepseek.com"
    api_key_env: "DEEPSEEK_API_KEY"
    hypothesis_model: "deepseek-chat"
    hardscore_model: "deepseek-chat"

gatecheck:
  fdr_q: 0.05
  dsr_prob_min: 0.95
  ic_tstat_nw_min: 2.0
  rankic_tstat_nw_min: 2.0
  sharpe_ci_5_min: 0.0
  min_oos_trades: 100
  max_regime_pnl_concentration: 0.80
  break_even_cost_multiple: 2.0
  prior_posterior_ic_max_ratio: 5.0
  return_autocorr_warn_abs: 0.10
  data_quality_degraded_warn_ratio: 0.10
  data_quality_degraded_block_ratio: 0.20
  research_survivor_promotion_fdr_p: 0.10
  research_survivor_min_oos_days: 90

exit_bounds:
  stop_loss_pct_min: -0.15
  stop_loss_pct_max: -0.01
  max_hold_bars_min: 10
  max_hold_bars_max: 2000
  tp_tier_pct_min: 0.005
  tp_tier_pct_max: 0.20
  tp_tier_fraction_min: 0.10
  tp_tier_fraction_max: 0.90
  max_tp_tiers: 4
  trailing_stop_pct_min: 0.005
  trailing_stop_pct_max: 0.10

evolutionary:
  enabled: true
  llm_mutations: true

factory:
  enabled: false
  use_llm: true
  # Grounded in near-miss diagnostics 2026-07-08 (post-reset rounds):
  # regime_mixing now dominates (regime-conditional IC ~4x raw 0.047 vs
  # 0.012); prior round fixed funding mixing and turnover but overshot
  # holding to ~856 bars, starving G7 (median 18.5 OOS trades vs 100).
  research_brief: >-
    BTCUSDT/ETHUSDT perpetual futures, 5m bars. Hard cost constraint:
    production requires break-even cost > 12 bps round-trip (taker 5 bps +
    slippage per side) - propose low-turnover mechanisms with average holding
    of 100-300 bars (~8-25h) and explicit entry hysteresis, but with enough
    signal frequency to produce at least 100 trades in the final
    out-of-sample year; a signal that fires a few times a month cannot be
    validated. Market-regime conditioning is required: gate entries on
    regime state (bull / bear / high-volatility, e.g. BTC 60-day rolling
    regime) and trade each mechanism only in regimes where its predictive
    power holds - regime-conditional IC runs ~4x unconditional in recent
    rounds, and signals that average across regimes cancel to zero.
    Funding-state conditioning remains valuable: condition entries, exits,
    or position size on funding regime (sign, extremes,
    time-to-funding-settlement). Short-side performance has been
    persistently negative: prefer long-biased mechanisms, or gate shorts
    behind demanding conditions (e.g. extreme positive funding plus downtrend
    regime). Avoid plain mean-reversion variants without an explicit cost
    story - that family is heavily explored. Specify explicit entry/exit
    conviction bands (enter only on strong signal, hold until it decays) so
    each trade is large enough that its expected move clears the round-trip
    cost budget; a signal that flips every bar is destroyed by fees no matter
    how predictive.
  min_new_days: 1.0
  trial_budget_per_round: 400
  family_budget_floor: 20
  demotion_max_consecutive_failures: 3
  watch_window_days: 30
  sync_hour_utc: 3
  sync_minute_utc: 15
  recheck_interval_days: 1
  max_run_hours: 12.0
  # 24 GB machine, ~20 GB historical peak: 21 is the "about to swap-storm"
  # tripwire (process-tree RSS), and 4 workers keeps the peak down in the
  # first place. Watchdog kills are safe — checkpoints + resume ratchet.
  max_rss_gb: 21.0
  max_workers: 4
